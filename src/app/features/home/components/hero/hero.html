<section class="hero">
  <div class="hero__info">
    <p class="hero__index">(00)</p>
    <p class="hero__meta">
      Portfolio 2026<br />Tyrol, Austria · <span class="hero__meta-label">Local time </span
      >{{ localTime.time() }}
    </p>
  </div>

  <h1 class="hero__title">Frontend <em>developer</em></h1>

  <figure class="hero__figure">
    <img class="hero__photo" src="img/portrait.png" alt="Portrait of Stefan Sträter" />
    <figcaption class="hero__caption">
      <span class="hero__caption-number">Fig. 01</span>
      <span>Self-portrait</span>
    </figcaption>
  </figure>

  <p class="hero__name">Stefan <em>Sträter</em></p>

  <p class="hero__tagline">
    With a designer’s eye.<br />
    Former photographer,<br />
    Open to junior roles
  </p>
